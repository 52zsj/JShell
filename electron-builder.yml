# 打包配置（全中文说明）
#
# 平台定位：macOS 与 Windows 同等重要，二者都产出「安装版 + 便携版」：
#   macOS  ：dmg（拖入应用程序） + zip（安装版备份） + *-portable.zip（解压即用）
#   Windows：NSIS 安装包（-setup.exe） + 便携版单文件（-portable.exe）
#
# 产物统一输出到 release/<version>/。
#
# 签名与公证（预留，内部渠道默认关闭）：
#   - macOS：设置 CSC_LINK / CSC_KEY_PASSWORD 自动签名；再配置 APPLE_ID /
#            APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID，afterSign 钩子会自动公证。
#   - Windows：设置 CSC_LINK / CSC_KEY_PASSWORD（或 certificateSubjectName）即可签名。
#   未配置凭据时产出未签名包，可直接内网分发（首次打开需按系统提示放行）。
#
# 更新通道（预留）：
#   内部渠道 build/release-meta.json 中 updateUrl 为空，应用不会发起任何网络请求；
#   开放公测时用 JSHELL_CHANNEL=public JSHELL_UPDATE_URL=https://... 重新生成即可，
#   渲染层与打包命令都不需要改。

appId: cn.jshell.desktop
productName: JShell
executableName: JShell
copyright: Copyright © 2026 JShell

directories:
  output: release/${version}
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# 随包分发的说明文档、发布元信息与托盘图标
extraResources:
  - from: build/release-meta.json
    to: release-meta.json
  - from: build/tray
    to: tray
  - from: docs/使用说明.md
    to: docs/manual.md
  - from: docs/privacy.md
    to: docs/privacy.md
  - from: docs/license.md
    to: docs/license.md
  - from: CHANGELOG.md
    to: docs/CHANGELOG.md
  - from: scripts/fix-windows-icon.bat
    to: fix-windows-icon.bat

asar: true
# node-pty 是原生模块（N-API 预编译），.node 与 spawn-helper 不能留在 asar 内
asarUnpack:
  - '**/node_modules/node-pty/**'
# 预编译产物与 Electron ABI 无关（N-API），不需要 rebuild
npmRebuild: false
compression: normal
removePackageScripts: true

# 公证钩子：未配置凭据时自动跳过，不会中断打包
afterSign: build/notarize.cjs

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    CFBundleDisplayName: JShell 终端
    CFBundleName: JShell
    NSHumanReadableCopyright: Copyright © 2026 JShell
  # 架构由命令行决定（默认当前主机架构）：
  #   electron-builder --mac --arm64 --x64   → 同时产出 Apple Silicon 与 Intel 包
  target:
    - dmg
    - zip
  artifactName: JShell-${version}-${arch}.${ext}

dmg:
  title: JShell ${version}
  window:
    width: 560
    height: 380
  contents:
    - x: 150
      y: 190
    - x: 410
      y: 190
      type: link
      path: /Applications

win:
  icon: build/icon.ico
  executableName: JShell
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: JShell-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: JShell 终端
  uninstallDisplayName: JShell 终端 ${version}
  # 安装向导仅提供简体中文，不做语言选择
  installerLanguages: [zh_CN]
  displayLanguageSelector: false
  language: '2052'
  artifactName: JShell-${version}-${arch}-setup.${ext}
  # 显式指定安装器/卸载器图标，避免回退到 Electron 默认图标
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # 安装时清理旧版本留下的 Electron 快捷方式（见 build/installer.nsh）
  include: build/installer.nsh
  # 开始菜单不建二级文件夹，直接用「JShell 终端」这一项
  menuCategory: false

# 便携版：单个 exe，双击即用；数据写在与 exe 同级的 JShell-Data 目录
portable:
  artifactName: JShell-${version}-${arch}-portable.${ext}
  requestExecutionLevel: user

linux:
  icon: build/icon.png
  category: Development
  maintainer: JShell <dev@jshell.local>
  synopsis: SSH 与终端管理工作台
  target:
    - AppImage
    - deb
  artifactName: JShell-${version}-${arch}.${ext}
